<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pratinjau Virtual Clean Lab — Alkaff</title>
<style>
  html,body{margin:0;width:100%;height:100%;background:#0a1310;overflow:hidden;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#d9f5ec}
  .wrap{display:flex;flex-direction:column;width:100%;height:100%}
  .view{flex:1;position:relative;min-height:0}
  iframe{display:block;width:100%;height:100%;border:0}
  .bar{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 12px;
    background:#10231d;border-top:1px solid rgba(143,224,204,.18);font-size:11px}
  .bar b{font-size:10px;letter-spacing:.16em;color:#8fe0cc;margin-right:6px}
  .bar button{border:1px solid rgba(143,224,204,.28);background:rgba(47,179,148,.10);
    color:#d9f5ec;padding:6px 10px;border-radius:7px;cursor:pointer;font:inherit}
  .bar button:hover{background:rgba(47,179,148,.24)}
  .bar button.on{background:#2fb394;color:#06251d;border-color:#2fb394;font-weight:700}
  .bar .sep{width:1px;height:20px;background:rgba(143,224,204,.22);margin:0 4px}
  .bar .hint{margin-left:auto;color:#7fc9b6;font-size:10px;letter-spacing:.04em}
</style>
</head>
<body>
<div class="wrap">
  <div class="view"><iframe id="scene" src="index.html" title="Virtual Clean Lab Alkaff"></iframe></div>
  <div class="bar">
    <b>KONTROL PRATINJAU</b>
    <button id="replay">↻ Ulang</button>
    <span class="sep"></span>
    <button data-scene="boot">Boot</button>
    <button data-scene="scan">Scan</button>
    <button data-scene="mix">Mixing</button>
    <button data-scene="analyze">AI</button>
    <button data-scene="result">Hasil</button>
    <span class="sep"></span>
    <button id="voice">🔊 Suara AI: OFF</button>
    <button id="sfx" class="on">♪ SFX: ON</button>
    <button id="stage">Panggung: Full</button>
    <button id="obs">Buka Mode OBS</button>
    <span class="hint">Kontrol ini di luar adegan — tidak tampil di LIVE/OBS.</span>
  </div>
</div>
<script>
(function(){
  var frame = document.getElementById("scene");
  function send(msg){ frame.contentWindow.postMessage(msg, "*"); }
  document.getElementById("replay").addEventListener("click", function(){ send({scene:"boot",auto:true}); });
  document.querySelectorAll("[data-scene]").forEach(function(b){
    b.addEventListener("click", function(){
      document.querySelectorAll("[data-scene]").forEach(function(x){ x.classList.remove("on"); });
      b.classList.add("on");
      send({scene:b.getAttribute("data-scene"),auto:false});
    });
  });
  var voice = document.getElementById("voice");
  voice.addEventListener("click", function(){
    var on = !voice.classList.contains("on");
    voice.classList.toggle("on", on);
    voice.textContent = on ? "🔊 Suara AI: ON" : "🔊 Suara AI: OFF";
    send({voice:on});
  });
  var sfx = document.getElementById("sfx");
  sfx.addEventListener("click", function(){
    var on = !sfx.classList.contains("on");
    sfx.classList.toggle("on", on);
    sfx.textContent = on ? "♪ SFX: ON" : "♪ SFX: OFF";
    send({sfx:on});
  });
  var stage = document.getElementById("stage");
  stage.addEventListener("click", function(){
    var split = stage.textContent.indexOf("Split") === -1;
    stage.textContent = split ? "Panggung: Split" : "Panggung: Full";
    send({stage:split ? "split" : "full"});
  });
  document.getElementById("obs").addEventListener("click", function(){
    window.open("index.html?obs=1", "_blank");
  });
})();
</script>
</body>
</html>
